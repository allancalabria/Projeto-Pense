<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo | default("Página Inicial") }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/iconoir-icons/iconoir@main/css/iconoir.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Xmind:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --font-sans: 'Xmind', sans-serif;

        --color-brand: var(--color-blue-500);
        --color-brand-hover: var(--color-blue-600);
        --color-on-brand: var(--color-white);

        --color-error: var(--color-red-600);
        --color-on-error: var(--color-white);
        --color-error-container: var(--color-red-50);
        --color-on-error-container: var(--color-red-800);

        --color-surface: var(--color-white);
        --color-on-surface: var(--color-slate-950);
        --color-on-surface-variant: var(--color-slate-700);

        --color-surface-container: var(--color-slate-100);
        --color-surface-container-high: var(--color-slate-200);

        --color-inverse-surface: var(--color-slate-900);
        --color-inverse-on-surface: var(--color-slate-50);
        --color-inverse-on-surface-hover: var(--color-slate-200);

        --color-outline: var(--color-slate-700);
        --color-outline-variant: var(--color-slate-200);
      }
    </style>
</head>
<body>
    <div class="game-wrapper" id="gameWrapper" data-sprite-path="{{ url_for('static', filename='img/sprites/') }}">
        <div class="absolute pointer-events-auto -bottom-18 hover:bottom-0 pb-4 m-4 mb-0 right-0 z-[1000] transition-all" id="charSelect">
            <div class="flex gap-2 p-2 rounded-2xl bg-inverse-surface text-inverse-on-surface items-center shadow-lg">
                <div class="flex flex-col items-center">
                    <img class="w-10 h-10 [image-rendering:pixelated] p-2 rounded-lg bg-inverse-on-surface/10 hover:bg-brand cursor-pointer transition-all active:scale-95" src="{{ url_for('static', filename='img/sprites/profile-b.png') }}" id="charBlack" alt="Black" title="Piloto Black">
                    <span class="text-[11px] font-mono font-bold leading-tight select-none pt-0.5" id="scoreBlack">0</span>
                </div>
                <div class="flex flex-col items-center">
                    <img class="w-10 h-10 [image-rendering:pixelated] p-2 rounded-lg bg-inverse-on-surface/10 hover:bg-brand cursor-pointer transition-all active:scale-95" src="{{ url_for('static', filename='img/sprites/profile-w.png') }}" id="charWhite" alt="White" title="Piloto White">
                    <span class="text-[11px] font-mono font-bold leading-tight select-none pt-0.5" id="scoreWhite">0</span>
                </div>
            </div>
        </div>
        <!-- Atores do jogo com suporte a animação de spritesheet -->
        <div class="sprite-box game-actor" id="target">
            <img class="sprite-sheet" src="{{ url_for('static', filename='img/sprites/front-b.png') }}" id="targetImg" alt="Alvo">
        </div>
        <div class="sprite-box game-actor" id="player">
            <img class="sprite-sheet" src="{{ url_for('static', filename='img/sprites/plane-w.png') }}" id="playerImg" alt="Avião">
        </div>
        <div class="sprite-box game-actor" id="bomb">
            <img class="sprite-sheet" src="{{ url_for('static', filename='img/sprites/bomb.png') }}" id="bombImg" alt="Bomba">
        </div>
        <div class="sprite-box game-actor" id="explosion">
            <img class="sprite-sheet" src="{{ url_for('static', filename='img/sprites/explosion.png') }}" id="explosionImg" alt="Explosão">
        </div>
    </div>
    <main class="flex flex-col text-on-surface bg-surface-container min-h-[100dvh]">
         {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
    <script type="module" src="{{ url_for('static', filename='js/game/main.js') }}"></script>
</body>
</html>
