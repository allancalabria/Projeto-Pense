{% extends 'base.html' %}

{% block content %}
<section class="w-full max-w-md mx-auto px-6 py-10">
    <div class="bg-white p-6 sm:p-8 border border-slate-200 rounded-lg">
        <p class="text-sm font-semibold text-blue-700">Área do participante</p>
        <h1 class="text-2xl font-semibold text-slate-950 mt-2">Entrar</h1>
        <form action="{{ url_for('login') }}" method="post" class="mt-6 flex flex-col gap-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label class="flex flex-col gap-1 text-sm font-medium text-slate-800">
                E-mail
                <input name="email" type="email" autocomplete="email" required class="rounded-md border border-slate-300 px-3 py-2.5 font-normal">
            </label>
            <label class="flex flex-col gap-1 text-sm font-medium text-slate-800">
                Senha
                <input name="senha" type="password" autocomplete="current-password" required class="rounded-md border border-slate-300 px-3 py-2.5 font-normal">
            </label>
            <button type="submit" class="mt-2 rounded-md bg-blue-700 px-4 py-2.5 font-medium text-white hover:bg-blue-800">Entrar</button>
        </form>
        <p class="mt-5 text-sm text-slate-600">Ainda não tem conta? <a href="{{ url_for('cadastro') }}" class="font-medium text-blue-700 hover:underline">Cadastre-se</a></p>
    </div>
</section>
{% endblock %}
