{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm p-4">
            <h2 class="mb-4 text-center">Submissão de Trabalho - PEnsE-Submite</h2>
            
            <!-- O formulário envia os dados via POST para a rota do Flask -->
            <form action="{{ url_for('form') }}" method="POST">
                
                <!-- Título do Trabalho -->
                <div class="mb-3">
                    <label for="titulo" class="form-label">Título do Trabalho</label>
                    <input type="text" class="form-control" id="titulo" name="titulo" placeholder="Digite o título do seu trabalho" required>
                </div>

                <!-- Nome do Autor -->
                <div class="mb-3">
                    <label for="autor" class="form-label">Nome do Autor</label>
                    <input type="text" class="form-control" id="autor" name="autor" placeholder="Nome completo do autor principal" required>
                </div>

                <!-- Campus/Instituição -->
                <div class="mb-3">
                    <label for="instituicao" class="form-label">Campus / Instituição</label>
                    <input type="text" class="form-control" id="instituicao" name="instituicao" placeholder="Ex: IFRS - Campus Farroupilha" required>
                </div>

                <!-- Modalidade (Opções de escolha) -->
                <div class="mb-3">
                    <label for="modalidade" class="form-label">Modalidade</label>
                    <select class="form-select" id="modalidade" name="modalidade" required>
                        <option value="" selected disabled>Selecione uma modalidade...</option>
                        <option value="Ensino">Ensino</option>
                        <option value="Pesquisa">Pesquisa</option>
                        <option value="Extensão">Extensão</option>
                    </select>
                </div>

                <!-- Resumo -->
                <div class="mb-3">
                    <label for="resumo" class="form-label">Resumo</label>
                    <textarea class="form-control" id="resumo" name="resumo" rows="5" placeholder="Digite o resumo acadêmico do seu trabalho..." required></textarea>
                    <div id="resumoHelp" class="form-text">Breve descrição contendo objetivos, metodologia e resultados.</div>
                </div>

                <!-- Botões de Ação -->
                <div class="d-flex justify-content-between align-items-center mt-4">
                    <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary px-4">Enviar Trabalho</button>
                </div>

            </form>
        </div>
    </div>
</div>
{% endblock %}
