{% extends 'base.html' %}

{% block content %}
<section class="w-full max-w-xl mx-auto px-6 py-10">
    <div class="bg-white p-6 sm:p-8 border border-slate-200 rounded-lg">
        <p class="text-sm font-semibold text-blue-700">Nova conta</p>
        <h1 class="text-2xl font-semibold text-slate-950 mt-2">Cadastro de usuário</h1>
        <p class="text-sm text-slate-600 mt-1">Use seu e-mail para entrar e acompanhar suas submissões.</p>

        <form action="{{ url_for('cadastro') }}" method="post" class="mt-6 flex flex-col gap-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label class="flex flex-col gap-1 text-sm font-medium text-slate-800">
                Nome completo
                <input name="nome" maxlength="160" autocomplete="name" required class="rounded-md border border-slate-300 px-3 py-2.5 font-normal">
            </label>
            <label class="flex flex-col gap-1 text-sm font-medium text-slate-800">
                E-mail
                <input name="email" type="email" maxlength="254" autocomplete="email" required class="rounded-md border border-slate-300 px-3 py-2.5 font-normal">
            </label>
            <label class="flex flex-col gap-1 text-sm font-medium text-slate-800">
                CPF
                <input name="cpf" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="000.000.000-00" required class="rounded-md border border-slate-300 px-3 py-2.5 font-normal">
            </label>
            <label class="flex flex-col gap-1 text-sm font-medium text-slate-800">
                Instituição / Campus
                <input name="instituicao" maxlength="255" autocomplete="organization" required class="rounded-md border border-slate-300 px-3 py-2.5 font-normal">
            </label>
            <label class="flex flex-col gap-1 text-sm font-medium text-slate-800">
                Senha
                <input name="senha" type="password" minlength="8" autocomplete="new-password" required class="rounded-md border border-slate-300 px-3 py-2.5 font-normal">
                <span class="text-xs font-normal text-slate-500">Mínimo de 8 caracteres.</span>
            </label>
            <button type="submit" class="mt-2 rounded-md bg-blue-700 px-4 py-2.5 font-medium text-white hover:bg-blue-800">Criar conta</button>
        </form>
        <p class="mt-5 text-sm text-slate-600">Já tem conta? <a href="{{ url_for('login') }}" class="font-medium text-blue-700 hover:underline">Entrar</a></p>
    </div>
</section>
{% endblock %}
